<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Agy-BugHunter — Google Antigravity Security Assessment Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="55%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2436" stroke-width="0.7" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow2)"/>

  <!-- Reticle + Shield Mark -->
  <g transform="translate(80, 90)">
    <circle cx="70" cy="70" r="54" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
    <circle cx="70" cy="70" r="40" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>
    <line x1="70" y1="6" x2="70" y2="24" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="116" x2="70" y2="134" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="70" x2="24" y2="70" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="116" y1="70" x2="134" y2="70" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 40 L94 52 V72 C94 88 82 100 70 104 C58 100 46 88 46 72 V52 Z" fill="#00e5ff" fill-opacity="0.14" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="70" cy="70" r="5" fill="#ff3366"/>
  </g>

  <!-- Title & Subtitle -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="260" y="138" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">Agy-BugHunter</text>
    <text x="262" y="178" font-size="20" font-weight="500" fill="#94a3b8">Google Antigravity Security Assessment &amp; Bug Bounty Harness</text>
  </g>

  <!-- Feature Pills -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600">
    <rect x="262" y="206" width="122" height="30" rx="6" fill="#0f172a" stroke="#00e5ff" stroke-opacity="0.5"/>
    <text x="323" y="226" text-anchor="middle" fill="#00e5ff">101 SKILLS</text>

    <rect x="398" y="206" width="142" height="30" rx="6" fill="#0f172a" stroke="#ff3366" stroke-opacity="0.5"/>
    <text x="469" y="226" text-anchor="middle" fill="#ff3366">SCOPE GUARD</text>

    <rect x="554" y="206" width="134" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="621" y="226" text-anchor="middle" fill="#38bdf8">PROGRESS.MD</text>

    <rect x="702" y="206" width="110" height="30" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="757" y="226" text-anchor="middle" fill="#a78bfa">ABH CLI</text>
  </g>
</svg>
